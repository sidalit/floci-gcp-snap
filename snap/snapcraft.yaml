name: floci-gcp
base: core26
version: '0.12.0'
title: Floci GCP
icon: snap/gui/floci-gcp.png
summary: A local GCP emulator for development and testing
description: |
  Floci GCP provides GCP-compatible gRPC and REST APIs for local development,
  testing and CI, including Cloud Storage, Pub/Sub, Firestore, Datastore,
  Secret Manager, Cloud KMS, IAM and Cloud Logging. Point your GCP SDK,
  gcloud or infrastructure tools at http://127.0.0.1:4588.

  The service starts on localhost and persists its state across restarts.
  Docker-backed services, including Cloud Run, Cloud SQL, Managed Kafka and
  GKE, require a separately installed Docker Engine and a manual interface
  connection. This is a development emulator; its APIs are not an
  authenticated service.
license: MIT
grade: stable
confinement: strict
website: https://floci.io/floci-gcp/
source-code:
  - https://github.com/floci-io/floci-gcp
  - https://github.com/sidalit/floci-gcp-snap
issues:
  - https://github.com/floci-io/floci-gcp/issues
  - https://github.com/sidalit/floci-gcp-snap/issues
contact: https://github.com/sidalit/floci-gcp-snap/issues

platforms:
  amd64:
  arm64:

environment:
  PATH: $SNAP/bin:$SNAP/usr/bin:$PATH

apps:
  floci-gcp:
    command: bin/floci-gcp-launch
    plugs:
      - home
      - network
      - network-bind
      - docker
      - removable-media

  daemon:
    command: bin/floci-gcp-daemon
    daemon: simple
    restart-condition: on-failure
    stop-timeout: 60s
    plugs:
      - network
      - network-bind
      - docker

layout:
  # Debian's JRE configuration contains absolute links into this directory.
  /etc/java-25-openjdk:
    bind: $SNAP/etc/java-25-openjdk
  # Upstream reads init hooks only from this fixed directory.
  /etc/floci-gcp/init:
    bind: $SNAP_COMMON/init

parts:
  floci-gcp:
    plugin: nil
    source: https://github.com/floci-io/floci-gcp.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    build-packages:
      - curl
      - openjdk-25-jdk-headless
      - unzip
    build-attributes: [enable-patchelf]
    stage-slices:
      - openjdk-25-jre-headless_standard
    override-build: |
      export JAVA_HOME="/usr/lib/jvm/java-25-openjdk-${CRAFT_ARCH_BUILD_FOR}"
      export PATH="$JAVA_HOME/bin:$PATH"
      ./mvnw --batch-mode package -DskipTests
      install -d "$CRAFT_PART_INSTALL/lib/floci-gcp"
      cp -a target/quarkus-app/. "$CRAFT_PART_INSTALL/lib/floci-gcp/"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/floci-gcp/LICENSE"

      # Include the trust store generated by the build environment's JRE.
      cp --remove-destination /etc/ssl/certs/java/cacerts \
        "$CRAFT_PART_INSTALL/usr/lib/jvm/java-25-openjdk-${CRAFT_ARCH_BUILD_FOR}/lib/security/cacerts"

  scripts:
    plugin: dump
    source: snap/local
